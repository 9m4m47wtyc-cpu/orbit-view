<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090e13"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<title>태양계 실험실 · 비공개 접속</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#090e13;color:#edf2f3}main{min-height:100%;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 23% 0%,#233039 0,transparent 50%)}form{width:min(365px,100%)}h1{font-size:clamp(32px,7vw,42px);letter-spacing:-.07em;margin:0 0 12px;font-weight:680}p{margin:0 0 32px;color:#aab8c0;font-size:15px;line-height:1.6}label{display:block;margin:0 0 8px;font-size:14px}input,button{font:inherit}input{width:100%;height:49px;border:1px solid #46565f;background:#101920;color:#fff;border-radius:7px;padding:0 14px;letter-spacing:.04em}input:focus-visible,button:focus-visible{outline:2px solid #a6e1d7;outline-offset:3px}button{cursor:pointer}form button{width:100%;margin-top:14px;border:0;border-radius:7px;padding:13px;background:#b9e4d9;color:#11241f;font-weight:680}form button:disabled{opacity:.65}#status{min-height:24px;margin:14px 0 0;font-size:14px}#scene{position:fixed;inset:0;display:block;width:100%;height:100%;border:0;background:#050709}#lock{display:grid;place-items:center;position:fixed;z-index:3;top:max(env(safe-area-inset-top),8px);left:50%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;border:1px solid #58646c;background:#0a1119de;color:#dce7e6}#lock svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6}body [hidden]{display:none!important}
</style><script defer src="gate.js"></script></head>
<body><main id="entrance"><form id="login"><h1>태양계 실험실</h1><p>공유받은 암호로 관측을 시작하세요.</p>
<label for="password">접속 암호</label><input id="password" name="password" type="password" autocomplete="current-password" required autocapitalize="none" spellcheck="false">
<button id="enter" type="submit">시뮬레이션 열기</button><p id="status" role="status" aria-live="polite"></p></form></main>
<button id="lock" type="button" aria-label="다시 잠그기" title="다시 잠그기" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></button>
</body></html>
